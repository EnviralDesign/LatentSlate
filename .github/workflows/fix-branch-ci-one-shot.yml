name: Apply branch CI test fix

on:
  push:
    branches:
      - agent/latent-engine-v0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latent-engine-v0
          fetch-depth: 0

      - name: Make the provider-builder unit test self-contained
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/egui_app/provider_builder.rs")
          text = path.read_text()

          old = (
              '    fn edit_existing_provider_preserves_manifest_output_key() {\n'
              '        let output_key = "custom_video_output";\n'
          )
          new = (
              '    fn edit_existing_provider_preserves_manifest_output_key() {\n'
              '        let output_key = "custom_video_output";\n'
              '        let workflow_path = std::env::temp_dir().join(format!(\n'
              '            "latentslate-provider-builder-{}.json",\n'
              '            Uuid::new_v4()\n'
              '        ));\n'
              '        std::fs::write(\n'
              '            &workflow_path,\n'
              '            r#"{"42":{"class_type":"PreviewVideo","inputs":{},"_meta":{"title":"Preview Video"}}}"#,\n'
              '        )\n'
              '        .expect("write workflow fixture");\n'
              '        let workflow_path_string = workflow_path.to_string_lossy().into_owned();\n'
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f"provider-builder test preamble matches: {text.count(old)}"
              )
          text = text.replace(old, new, 1)

          old_workflow = '                workflow_path: "workflow.json".to_string(),'
          replacement = '                workflow_path: workflow_path_string.clone(),'
          if text.count(old_workflow) != 1:
              raise SystemExit(
                  f"manifest workflow-path matches: {text.count(old_workflow)}"
              )
          text = text.replace(old_workflow, replacement, 1)

          old_connection = '                workflow_path: Some("workflow.json".to_string()),'
          connection_replacement = '                workflow_path: Some(workflow_path_string),'
          if text.count(old_connection) != 1:
              raise SystemExit(
                  f"connection workflow-path matches: {text.count(old_connection)}"
              )
          text = text.replace(old_connection, connection_replacement, 1)

          old_end = (
              '        assert_eq!(output.selector.input_key, output_key);\n'
              '    }\n'
              '}\n'
          )
          new_end = (
              '        assert_eq!(output.selector.input_key, output_key);\n'
              '        std::fs::remove_file(workflow_path).expect("remove workflow fixture");\n'
              '    }\n'
              '}\n'
          )
          if text.count(old_end) != 1:
              raise SystemExit(f"provider-builder test ending matches: {text.count(old_end)}")
          path.write_text(text.replace(old_end, new_end, 1))
          PY

      - name: Commit the source fix directly to the feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/egui_app/provider_builder.rs
          git diff --cached --check
          git commit -m "make provider builder test self-contained"
          git push origin HEAD:agent/latent-engine-v0
