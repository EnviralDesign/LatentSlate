name: CI

on:
  push:
    branches: [main, agent/latent-engine-v0]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  VCPKG_COMMIT: 39ec37c17d122da0c98c3279e6a6b0f4efb75c4a
  VCPKG_ROOT: ${{ github.workspace }}\.ci-vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\.vcpkg-binary-cache,readwrite"

jobs:
  rust-windows:
    name: Rust checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned vcpkg (FFmpeg 8.1.2)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .ci-vcpkg

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.VCPKG_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.VCPKG_COMMIT }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-ffmpeg-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-ffmpeg-x64-windows-${{ env.VCPKG_COMMIT }}-

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows

      - name: Cargo check
        run: cargo check --locked

      - name: Unit tests
        run: cargo test --locked

      # Clippy is intentionally not a required CI gate yet. The current codebase
      # has pre-existing lint debt with `cargo clippy --all-targets -- -D warnings`.
