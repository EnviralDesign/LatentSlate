name: Apply Klein catalog parity checks

on:
  push:
    branches:
      - agent/latent-engine-v0

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latent-engine-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add Klein catalog coverage and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/providers/latentslate_engine.rs",
              '''    #[test]
              fn cached_catalog_tools_are_inspectable_but_unavailable() {
          ''',
              '''    #[test]
              fn klein_image_tools_normalize_into_existing_image_categories() {
                  let catalog: EngineCatalog = serde_json::from_value(json!({
                      "protocol_version": "1.0",
                      "engine_version": "0.1.0",
                      "bundles": [],
                      "tools": [
                          {
                              "id": "e329a7d2-c145-4299-96ef-f2b70376d499",
                              "key": "flux2_klein9b.text_to_image",
                              "schema_revision": 1,
                              "schema_hash": "sha256:t2i",
                              "name": "Text to Image",
                              "workflow_kind": "text_to_image",
                              "output": { "type": "image" },
                              "inputs": [
                                  { "key": "prompt", "label": "Prompt", "type": "text", "required": true },
                                  { "key": "size", "label": "Size", "type": "choice", "required": true, "default": "1024x1024", "options": [
                                      { "value": "1024x1024", "label": "1024x1024" }
                                  ]},
                                  { "key": "seed", "label": "Seed", "type": "integer", "required": true, "default": 0, "role": "seed" }
                              ],
                              "available": true
                          },
                          {
                              "id": "3333a6bd-8e71-4236-9372-bad407161803",
                              "key": "flux2_klein9b.image_to_image",
                              "schema_revision": 1,
                              "schema_hash": "sha256:i2i",
                              "name": "Image to Image",
                              "workflow_kind": "image_to_image",
                              "output": { "type": "image" },
                              "inputs": [
                                  { "key": "prompt", "label": "Prompt", "type": "text", "required": true },
                                  { "key": "source_image", "label": "Source Image", "type": "image", "required": true, "role": "source_image" },
                                  { "key": "size", "label": "Size", "type": "choice", "required": true, "default": "source", "options": [
                                      { "value": "source", "label": "source" },
                                      { "value": "1024x1024", "label": "1024x1024" }
                                  ]},
                                  { "key": "seed", "label": "Seed", "type": "integer", "required": true, "default": 0, "role": "seed" }
                              ],
                              "available": true
                          }
                      ]
                  }))
                  .expect("catalog");

                  let entries =
                      catalog_to_provider_entries(&catalog, &EngineConnectionSettings::default())
                          .expect("providers");
                  assert_eq!(entries.len(), 2);

                  let text = &entries[0];
                  assert_eq!(text.name, "Text to Image");
                  assert_eq!(text.output_type, ProviderOutputType::Image);
                  assert_eq!(text.workflow_kind, ProviderWorkflowKind::TextToImage);
                  assert!(matches!(
                      &text.inputs[1].input_type,
                      ProviderInputType::Enum { options }
                          if options == &["1024x1024".to_string()]
                  ));

                  let edit = &entries[1];
                  assert_eq!(edit.name, "Image to Image");
                  assert_eq!(edit.output_type, ProviderOutputType::Image);
                  assert_eq!(edit.workflow_kind, ProviderWorkflowKind::ImageToImage);
                  assert_eq!(edit.inputs[1].role, Some(InputRole::StartImage));
                  assert!(matches!(edit.inputs[1].input_type, ProviderInputType::Image));
                  assert!(matches!(
                      &edit.connection,
                      ProviderConnection::LatentSlateEngine { tool_key, .. }
                          if tool_key == "flux2_klein9b.image_to_image"
                  ));
              }

              #[test]
              fn cached_catalog_tools_are_inspectable_but_unavailable() {
          ''',
          )

          replace_once(
              "docs/PROVIDERS.md",
              '''The V0 Engine catalog contains two simple upstream-Diffusers MiniMax-H3 tools:

          - `h3.text_to_video`: text to short video with synchronized audio.
          - `h3.first_last_frame_video`: first-frame plus optional last-frame video with synchronized audio.

          The Engine is deliberately not optimized yet. Full H3 inference has not been
          validated on the target RTX 5080 / 64 GB workstation, and the stock INT8 loading
          path may still exceed comfortable system-RAM headroom.
          ''',
              '''The V0 Engine catalog currently follows four existing LatentSlate categories:

          - `h3.text_to_video`: Text to Video with synchronized audio.
          - `h3.first_last_frame_video`: First/Last Frame Video with synchronized audio.
          - `flux2_klein9b.text_to_image`: Text to Image with FLUX.2 Klein 9B.
          - `flux2_klein9b.image_to_image`: Image to Image with one source image and FLUX.2 Klein 9B.

          These are deliberately simple correctness-first implementations. Full H3 and Klein
          inference have not yet been validated on the target RTX 5080 / 64 GB workstation.
          The Engine owns model loading, quantization profiles, and model-family eviction;
          LatentSlate consumes the same catalog, schema, queue, upload, and artifact contract
          for both image and video tools.
          ''',
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              "- LatentSlate Engine image/video/audio contract over HTTP; the current Engine catalog exposes two H3 video tools.\n",
              "- LatentSlate Engine image/video/audio contract over HTTP; the current catalog exposes H3 video and Klein 9B image tools.\n",
          )
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Preserve permanent manifest and lockfile
        run: |
          cp Cargo.toml /tmp/Cargo.toml.permanent
          cp Cargo.lock /tmp/Cargo.lock.permanent

      - name: Enable ephemeral Linux window backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'features = ["glow", "default_fonts"]'
          new = 'features = ["glow", "default_fonts", "x11"]'
          if text.count(old) != 1:
              raise SystemExit("Expected one eframe feature declaration")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config \
            libasound2-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev

      - name: Resolve ephemeral Linux feature lockfile
        run: cargo metadata --format-version 1 > /dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check

      - name: Engine adapter tests
        run: cargo test providers::latentslate_engine::tests

      - name: Restore permanent manifest and lockfile
        if: success()
        run: |
          cp /tmp/Cargo.toml.permanent Cargo.toml
          cp /tmp/Cargo.lock.permanent Cargo.lock

      - name: Commit validated parity coverage
        if: success()
        shell: bash
        run: |
          rm .github/workflows/klein-catalog-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cover Klein Engine catalog tools"
          git push origin HEAD:agent/latent-engine-v0
