name: Apply provider identity UI pass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Correct migration selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/provider_identity_one_shot.py")
          text = path.read_text()

          old = '''replace_once(
              "src/egui_app/provider_builder.rs",
              ''' + "'''" + '''        Pos2::new(rect.left(), rect.bottom() - 2.0),
          ''' + "'''" + ''',
              ''' + "'''" + '''        Pos2::new(text_left, rect.bottom() - 2.0),
          ''' + "'''" + ''',
          )
          '''
          new = '''replace_once(
              "src/egui_app/provider_builder.rs",
              ''' + "'''" + '''    paint_truncated_row_text_bottom(
                  ui,
                  Pos2::new(rect.left(), rect.bottom() - 2.0),
                  kit::caption(&summary.subtitle),
          ''' + "'''" + ''',
              ''' + "'''" + '''    paint_truncated_row_text_bottom(
                  ui,
                  Pos2::new(text_left, rect.bottom() - 2.0),
                  kit::caption(&summary.subtitle),
          ''' + "'''" + ''',
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one ambiguous selector block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          text, docs_count = re.subn(
              r'\nreplace_once\(\n    "docs/PROVIDERS\.md",.*?\n\)\n?\Z',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if docs_count != 1:
              raise SystemExit(f"Expected one optional docs edit block, found {docs_count}")
          path.write_text(text)
          PY

      - name: Add provider identity badges and Engine catalog observability
        run: python scripts/provider_identity_one_shot.py

      - name: Repair generated source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          builder = Path("src/egui_app/provider_builder.rs")
          text = builder.read_text()
          text, count = re.subn(
              r'\nimpl ProviderSourceKind \{.*?\n\}\n\npub\(super\) fn provider_row\(',
              '\npub(super) fn provider_row(',
              text,
              count=1,
              flags=re.S,
          )
          if count > 1:
              raise SystemExit(f"Found more than one legacy ProviderSourceKind impl: {count}")
          builder.write_text(text)

          identity = Path("src/egui_app/provider_identity.rs")
          text = identity.read_text()
          replacements = {
              "pub(super) fn provider_labeled_selector(":
                  "pub(super) fn provider_labeled_selector<Id: Hash + 'static>(",
              "    id_salt: impl Hash,": "    id_salt: Id,",
              "    provider_identity_row(ui, provider, selected, true)":
                  "    provider_identity_row(ui, provider, selected, provider_is_available(provider))",
              "            response.on_hover_cursor(egui::CursorIcon::PointingHand),":
                  "            response.clone().on_hover_cursor(egui::CursorIcon::PointingHand),",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one generated-source replacement, found {text.count(old)}: {old!r}")
              text = text.replace(old, new, 1)
          identity.write_text(text)

          attributes = Path("src/egui_app/attributes_panel.rs")
          text = attributes.read_text()
          old = "    provider_identity_row(ui, provider, false, true)"
          new = "    provider_identity_row(ui, provider, false, provider_is_available(provider))"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one context-menu identity row, found {text.count(old)}")
          attributes.write_text(text.replace(old, new, 1))

          asset_lab = Path("src/egui_app/asset_lab.rs")
          text = asset_lab.read_text()
          old = '''            let node_provider = node.provider_id.and_then(|id| {
                self.editor
                    .provider_entries
                    .iter()
                    .find(|provider| provider.id == id)
            });
            let node_label = node_provider
                .map(|provider| provider.name.clone())
                .unwrap_or_else(|| "Staged step".to_string());
'''
          new = '''            let node_label = node
                .provider_id
                .map(|id| asset_lab_provider_name(&self.editor.provider_entries, id))
                .unwrap_or_else(|| "Staged step".to_string());
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one generated node-provider block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                let provider_text_left = if let Some(provider) = node_provider {
                    let badge_rect = Rect::from_min_size(
                        Pos2::new(text_left, text_top + 19.0),
                        Vec2::new(30.0, 16.0),
                    );
                    paint_provider_source_badge_for_provider(ui, badge_rect, provider);
                    badge_rect.right() + 6.0
                } else {
                    text_left
                };
                painter.text(
                    Pos2::new(provider_text_left, text_top + 20.0),
                    egui::Align2::LEFT_TOP,
                    node_label,
                    FontId::proportional(11.0),
                    kit::TEXT_MUTED,
                );
'''
          new = '''                painter.text(
                    Pos2::new(text_left, text_top + 20.0),
                    egui::Align2::LEFT_TOP,
                    node_label,
                    FontId::proportional(11.0),
                    kit::TEXT_MUTED,
                );
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one generated graph-node badge block, found {text.count(old)}")
          asset_lab.write_text(text.replace(old, new, 1))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Preserve permanent manifest and lockfile
        run: |
          cp Cargo.toml /tmp/Cargo.toml.permanent
          cp Cargo.lock /tmp/Cargo.lock.permanent

      - name: Enable ephemeral Linux window backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'features = ["glow", "default_fonts"]'
          new = 'features = ["glow", "default_fonts", "x11"]'
          if text.count(old) != 1:
              raise SystemExit("Expected one eframe feature declaration")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config \
            libasound2-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev

      - name: Resolve ephemeral Linux feature lockfile
        run: cargo metadata --format-version 1 > /dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check

      - name: Provider identity tests
        run: cargo test provider_identity

      - name: Restore permanent manifest and lockfile
        if: success()
        run: |
          cp /tmp/Cargo.toml.permanent Cargo.toml
          cp /tmp/Cargo.lock.permanent Cargo.lock

      - name: Commit validated UI pass
        if: success()
        shell: bash
        run: |
          rm .github/workflows/provider-identity-one-shot.yml
          rm scripts/provider_identity_one_shot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "add provider source badges and Engine observability"
          git push origin HEAD:main
