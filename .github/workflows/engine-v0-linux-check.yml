name: Engine v0 Linux compile gate

on:
  push:
    branches:
      - agent/latent-engine-v0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check 2>&1 | tee engine-v0-cargo-check.log
      - name: Upload Cargo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v0-cargo-check-${{ github.run_id }}
          path: engine-v0-cargo-check.log
          if-no-files-found: warn
      - name: Unit tests
        run: cargo test --lib
