name: Apply and validate Engine v0 compile fixes

on:
  push:
    branches:
      - agent/latent-engine-v0

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latent-engine-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply compiler fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/providers/latentslate_engine.rs",
              "    let mut settings = fs::read_to_string(connection_settings_path())",
              "    let mut settings: EngineConnectionSettings = fs::read_to_string(connection_settings_path())",
          )
          replace_once(
              "src/providers/latentslate_engine.rs",
              "            provider.inputs[3].input_type,",
              "            &provider.inputs[3].input_type,",
          )
          replace_once(
              "src/providers/latentslate_engine.rs",
              "            provider.connection,",
              "            &provider.connection,",
          )

          replace_once(
              "src/egui_app/provider_builder.rs",
              "    ComfyUi,\n    OpenAi,",
              "    ComfyUi,\n    LatentSlateEngine,\n    OpenAi,",
          )
          replace_once(
              "src/egui_app/provider_builder.rs",
              '            Self::ComfyUi => "ComfyUI",',
              '            Self::ComfyUi => "ComfyUI",\n            Self::LatentSlateEngine => "LatentSlate Engine",',
          )
          replace_once(
              "src/egui_app/provider_builder.rs",
              "            Self::ComfyUi => 0,\n            Self::OpenAi => 1,\n            Self::Xai => 2,\n            Self::CustomHttp => 3,\n            Self::Other => 4,",
              "            Self::LatentSlateEngine => 0,\n            Self::ComfyUi => 1,\n            Self::OpenAi => 2,\n            Self::Xai => 3,\n            Self::CustomHttp => 4,\n            Self::Other => 5,",
          )
          replace_once(
              "src/egui_app/provider_builder.rs",
              "        ProviderConnection::CustomHttp { base_url, .. } => {",
              '''        ProviderConnection::LatentSlateEngine {
              base_url, tool_key, ..
          } => (
              ProviderSourceKind::LatentSlateEngine,
              format!("{tool_key} · {base_url}"),
          ),
          ProviderConnection::CustomHttp { base_url, .. } => {''',
          )
          PY

      - name: Format and resolve permanent lockfile
        shell: bash
        run: |
          cargo fmt --all
          cargo metadata --format-version 1 > /dev/null
          cp Cargo.toml /tmp/Cargo.toml.permanent
          cp Cargo.lock /tmp/Cargo.lock.permanent

      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev pkg-config \
            libasound2-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev

      - name: Enable an ephemeral Linux window backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'features = ["glow", "default_fonts"]'
          new = 'features = ["glow", "default_fonts", "x11"]'
          if text.count(old) != 1:
              raise SystemExit("Expected one eframe feature declaration")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check 2>&1 | tee engine-v0-cargo-check.log

      - name: Integration-surface tests
        shell: bash
        run: |
          set -o pipefail
          {
            cargo test providers::latentslate_engine::tests
            cargo test state::providers::tests
            cargo test editor::tests::redacts_custom_http_provider_api_key
          } 2>&1 | tee engine-v0-cargo-test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v0-rust-diagnostics-${{ github.run_id }}
          path: |
            engine-v0-cargo-check.log
            engine-v0-cargo-test.log
          if-no-files-found: warn

      - name: Restore permanent manifest and lockfile
        if: success()
        run: |
          cp /tmp/Cargo.toml.permanent Cargo.toml
          cp /tmp/Cargo.lock.permanent Cargo.lock
          rm .github/workflows/engine-v0-linux-check.yml

      - name: Commit validated fixes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix LatentSlate Engine integration checks"
          git push origin HEAD:agent/latent-engine-v0
